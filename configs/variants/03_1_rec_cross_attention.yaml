variant:
  name: 03_1_rec_cross_attention
  train_module: scripts.train_rec
  infer_module: scripts.infer_rec
seed: 0
output: results/by_version/03_1_rec_cross_attention/new_runs
data:
  layout: drivestudio
  root: /mnt/data/dataset/notr/processed/training
  split_file: splits/waymo_ds.json
  cameras: [0, 1, 2]
  clip_length: 20
  num_context: 4
  frame_stride: 5
  num_target: 4
  resolution: [576, 768]
  resolutions: [[352, 512], [576, 768]]
  max_instances: 24
  load_lidar: true
  require_lidar: true
  require_instances: true
  require_contiguous: true
  apply_opencv2waymo: true
model:
  variant: rec_cross_attention
  backbone: tf_efficientnetv2_s
  feat_dim: 128
  color_dim: 128
  hidden: 128
  num_static: 100000
  num_dynamic: 10000
  fusion_chunk: 65536
  decoder_chunk: 262144
  grad_checkpoint: true
rec:
  num_windows: 2
  scene_fusion:
    heads: 8
    layers: 2
    ffn_mult: 2
    pe_bands: 6
    pe_scale: 0.1
    voxel_size: 2.0
    max_anchors: 8192
    chunk_size: 32768
    grad_checkpoint: true
depth:
  kind: infinidepth
  repo_root: /mnt/data/why/InfiniDepth
  checkpoint: /mnt/data/why/InfiniDepth/checkpoints/depth/infinidepth_depthsensor.ckpt
  variant: InfiniDepth_DepthSensor
  encoder: vitl16
train:
  warm_start: /mnt/data/why/PointForward/clip20/runs/waymo_ds_paper/ckpt_020000.pt
  steps: 5000
  batch_size: 4
  lr: 0.0002
  weight_decay: 0.05
  warmup_steps: 500
  lpips_weight: 0.2
  grad_clip: 1.0
  num_workers: 8
  log_every: 25
  save_every: 500